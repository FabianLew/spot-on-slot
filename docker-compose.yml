# Local development services. The backend starts them automatically (spring-boot-docker-compose),
# or run `docker compose up -d` by hand.
services:
  postgres:
    image: postgis/postgis:16-3.5
    labels:
      org.springframework.boot.service-connection: postgres
    environment:
      POSTGRES_DB: spotonslot
      POSTGRES_USER: spotonslot
      POSTGRES_PASSWORD: spotonslot
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spotonslot -d spotonslot"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  # S3-compatible storage for media (Cloudflare R2 in prod). MinIO no longer publishes free images.
  # It accepts any credentials and allows browser uploads from any origin (CORS).
  s3mock:
    image: adobe/s3mock:5.2.3
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: spotonslot-media
      # Keep files in the volume across restarts (the default is a temp dir wiped on exit).
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /s3mockroot
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "true"
    ports:
      - "9090:9090"
    volumes:
      - s3mock-data:/s3mockroot

volumes:
  postgres-data:
  s3mock-data:
