# Production stack for Coolify (Build Pack "Docker Compose", file /deploy/docker-compose.yml): backend, PostgreSQL + PostGIS
# and the Photon geocoder. Only the backend gets a domain; the database and Photon stay on the stack's internal network.
# Coolify lists every ${VAR} below in the resource's Environment Variables; SERVICE_PASSWORD_* values it generates itself.
# Step by step: docs/deployment.md.
# Build contexts are relative to the repository root: Coolify runs compose with the repo root as the project directory.
services:
  backend:
    build:
      context: ./apps/backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/spotonslot
      DB_USERNAME: spotonslot
      DB_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://app.spotonslot.com,https://spotonslot.com,https://www.spotonslot.com}
      WEB_BASE_URL: ${WEB_BASE_URL:-https://app.spotonslot.com}
      LANDING_BASE_URL: ${LANDING_BASE_URL:-https://spotonslot.com}
      JWT_SECRET: ${SERVICE_PASSWORD_64_JWT}
      MAIL_HOST: ${MAIL_HOST:?}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:?}
      MAIL_PASSWORD: ${MAIL_PASSWORD:?}
      MAIL_FROM: ${MAIL_FROM:-no-reply@spotonslot.com}
      MAIL_CONTACT: ${MAIL_CONTACT:-}
      MEDIA_ENDPOINT: ${MEDIA_ENDPOINT:-https://hel1.your-objectstorage.com}
      MEDIA_REGION: ${MEDIA_REGION:-hel1}
      MEDIA_BUCKET: ${MEDIA_BUCKET:-spotonslot-media}
      MEDIA_ACCESS_KEY: ${MEDIA_ACCESS_KEY:?}
      MEDIA_SECRET_KEY: ${MEDIA_SECRET_KEY:?}
      MEDIA_PUBLIC_BASE_URL: ${MEDIA_PUBLIC_BASE_URL:-https://spotonslot-media.hel1.your-objectstorage.com}
      LOCATION_GEOCODER_URL: ${LOCATION_GEOCODER_URL:-http://photon:2322}
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3

  postgres:
    image: postgis/postgis:16-3.5
    restart: unless-stopped
    environment:
      POSTGRES_DB: spotonslot
      POSTGRES_USER: spotonslot
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Dumps from the Coolify scheduled task (docs/deployment.md), kept apart from the data directory.
      - postgres-backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spotonslot -d spotonslot"]
      interval: 5s
      timeout: 5s
      retries: 10

  photon:
    build:
      context: ./deploy/photon
    restart: unless-stopped
    environment:
      # Poland JSON dump (.jsonl.zst) for Photon 1.0 from https://download1.graphhopper.com/public/ (see docs/deployment.md).
      PHOTON_DUMP_URL: ${PHOTON_DUMP_URL:?}
      JAVA_OPTS: ${PHOTON_JAVA_OPTS:--Xmx2g}
    volumes:
      - photon-data:/photon/data

volumes:
  postgres-data:
  postgres-backups:
  photon-data:
