name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build, tests, modularity)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Test (Testcontainers + Spring Modulith verify)
        run: ./gradlew test --no-daemon
      - name: Upload OpenAPI spec
        uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: apps/backend/build/openapi/openapi.json

  frontend:
    name: Frontend (api client, lint, typecheck, build)
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: openapi
          path: apps/backend/build/openapi
      - name: Check generated API client is up to date
        run: |
          pnpm api:generate
          git diff --exit-code -- packages/api-client/src/schema.d.ts \
            || (echo "::error::packages/api-client is stale. Run the backend tests, then pnpm api:generate, and commit." && exit 1)
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
