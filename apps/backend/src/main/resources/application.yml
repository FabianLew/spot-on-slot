spring:
  profiles:
    default: dev
  application:
    name: spot-on-slot
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/spotonslot}
    username: ${DB_USERNAME:spotonslot}
    password: ${DB_PASSWORD:spotonslot}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
  mvc:
    problemdetails:
      enabled: true
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: false
      republish-outstanding-events-on-restart: true

logging:
  pattern:
    level: "%5p [%X{requestId:-}]"

server:
  error:
    whitelabel:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  default-produces-media-type: application/json

spotonslot:
  version: ${APP_VERSION:dev}
  mail:
    from: ${MAIL_FROM:no-reply@spotonslot.local}
  landing:
    base-url: ${LANDING_BASE_URL:http://localhost:3001}
