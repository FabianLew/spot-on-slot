spring:
  profiles:
    default: dev
  application:
    name: spot-on-slot
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/spotonslot}
    username: ${DB_USERNAME:spotonslot}
    password: ${DB_PASSWORD:spotonslot}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      # JavaMail waits forever by default; a blackholed relay must not block listener threads.
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  mvc:
    problemdetails:
      enabled: true
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: false
      republish-outstanding-events-on-restart: true

logging:
  pattern:
    level: "%5p [%X{requestId:-}]"

server:
  error:
    whitelabel:
      enabled: false

management:
  health:
    mail:
      # Mail is non-critical: failed sends stay in the Modulith event registry and are retried,
      # so an SMTP outage must not make /actuator/health (the container HEALTHCHECK) fail.
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  default-produces-media-type: application/json

spotonslot:
  version: ${APP_VERSION:dev}
  mail:
    from: ${MAIL_FROM:no-reply@spotonslot.local}
    # Contact address in account e-mails ("this wasn't me"); defaults to the sender.
    contact: ${MAIL_CONTACT:}
  landing:
    base-url: ${LANDING_BASE_URL:http://localhost:3001}
  web:
    base-url: ${WEB_BASE_URL:http://localhost:3000}
  terms:
    # Version of the terms of service and privacy policy accepted at registration (stored with the account).
    version: "2026-10-07"
  identity:
    # Development-only key; prod requires JWT_SECRET (application-prod.yml has no default).
    jwt-secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
  media:
    # Defaults point at S3Mock from docker compose (it accepts any credentials); prod requires all of them.
    endpoint: ${MEDIA_ENDPOINT:http://localhost:9090}
    presign-endpoint: ${MEDIA_PRESIGN_ENDPOINT:}
    region: ${MEDIA_REGION:auto}
    bucket: ${MEDIA_BUCKET:spotonslot-media}
    access-key: ${MEDIA_ACCESS_KEY:local}
    secret-key: ${MEDIA_SECRET_KEY:local}
    public-base-url: ${MEDIA_PUBLIC_BASE_URL:http://localhost:9090/spotonslot-media}
  location:
    # The public Photon instance is for development only; prod requires its own (LOCATION_GEOCODER_URL).
    geocoder-url: ${LOCATION_GEOCODER_URL:https://photon.komoot.io}
