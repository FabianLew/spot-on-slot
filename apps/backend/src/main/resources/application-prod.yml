logging:
  structured:
    format:
      console: ecs

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

server:
  # Behind the Coolify (Traefik) proxy: trust its X-Forwarded-* headers for the scheme and client address.
  forward-headers-strategy: native

spring:
  mail:
    # Required in prod: no defaults, startup fails without them.
    host: ${MAIL_HOST}
    # Submission port with STARTTLS; Hetzner blocks outgoing 25 and 465 on new servers.
    port: ${MAIL_PORT:587}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true

spotonslot:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  mail:
    from: ${MAIL_FROM}
  landing:
    base-url: ${LANDING_BASE_URL}
  web:
    base-url: ${WEB_BASE_URL}
  identity:
    jwt-secret: ${JWT_SECRET}
  media:
    endpoint: ${MEDIA_ENDPOINT}
    bucket: ${MEDIA_BUCKET}
    access-key: ${MEDIA_ACCESS_KEY}
    secret-key: ${MEDIA_SECRET_KEY}
    public-base-url: ${MEDIA_PUBLIC_BASE_URL}
  location:
    geocoder-url: ${LOCATION_GEOCODER_URL}
