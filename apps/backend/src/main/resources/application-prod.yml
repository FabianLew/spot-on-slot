logging:
  structured:
    format:
      console: ecs

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

spring:
  mail:
    # Required in prod: no defaults, startup fails without them.
    host: ${MAIL_HOST}

spotonslot:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  mail:
    from: ${MAIL_FROM}
  landing:
    base-url: ${LANDING_BASE_URL}
  web:
    base-url: ${WEB_BASE_URL}
  identity:
    jwt-secret: ${JWT_SECRET}
  media:
    endpoint: ${MEDIA_ENDPOINT}
    bucket: ${MEDIA_BUCKET}
    access-key: ${MEDIA_ACCESS_KEY}
    secret-key: ${MEDIA_SECRET_KEY}
    public-base-url: ${MEDIA_PUBLIC_BASE_URL}
  location:
    geocoder-url: ${LOCATION_GEOCODER_URL}
