spring:
  docker:
    compose:
      file: ../../docker-compose.yml
      lifecycle-management: start-only

spotonslot:
  cors:
    allowed-origins:
      - http://localhost:3000
      - http://localhost:3001
  identity:
    # Plain http on localhost: a Secure cookie would still work in Chrome, but not in every browser.
    cookie-secure: false
